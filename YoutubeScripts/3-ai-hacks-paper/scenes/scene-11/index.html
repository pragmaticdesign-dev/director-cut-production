<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 11 - Daily Hacks Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="daily-pill">📅 DAILY HACKS</div>
    <div class="calendar">
      <div class="cal-header">APRIL 2026</div>
      <div class="cal-weekdays">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div class="cal-days">
        <div class="cal-day checked">1<span class="checkmark">✅</span></div>
        <div class="cal-day checked">2<span class="checkmark">✅</span></div>
        <div class="cal-day checked">3<span class="checkmark">✅</span></div>
        <div class="cal-day checked">4<span class="checkmark">✅</span></div>
        <div class="cal-day checked">5<span class="checkmark">✅</span></div>
        <div class="cal-day checked">8<span class="checkmark">✅</span></div>
        <div class="cal-day checked">9<span class="checkmark">✅</span></div>
        <div class="cal-day checked">10<span class="checkmark">✅</span></div>
        <div class="cal-day checked">11<span class="checkmark">✅</span></div>
        <div class="cal-day checked">12<span class="checkmark">✅</span></div>
      </div>
    </div>
    <div class="cta-text">Build your <span>streak</span> 🔥</div>
    <div class="streak-badge">🏆 18 DAY STREAK</div>
  </div>
</body>
</html>
