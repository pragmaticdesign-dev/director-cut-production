<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 07 - YouTube to Podcast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="flow-row">
      <div class="yt-icon">
        <svg viewBox="0 0 70 70">
          <polygon class="yt-play" points="20,10 20,60 60,35" />
        </svg>
      </div>
      <svg class="flow-arrow" viewBox="0 0 120 60">
        <path d="M 5 30 L 85 30" />
        <path d="M 70 15 L 90 30 L 70 45" />
      </svg>
      <div class="phone-container">
        <svg class="phone-svg" viewBox="0 0 260 440">
          <rect class="phone-body" x="10" y="10" width="240" height="420" rx="30" />
          <rect class="phone-screen" x="25" y="60" width="210" height="320" rx="5" />
          <rect class="phone-notch" x="90" y="25" width="80" height="12" rx="6" />
          <g transform="translate(55, 180)">
            <rect class="waveform-bar" x="0" y="15" width="14" height="30" />
            <rect class="waveform-bar" x="22" y="5" width="14" height="50" />
            <rect class="waveform-bar" x="44" y="18" width="14" height="24" />
            <rect class="waveform-bar" x="66" y="2" width="14" height="56" />
            <rect class="waveform-bar" x="88" y="10" width="14" height="40" />
            <rect class="waveform-bar" x="110" y="8" width="14" height="44" />
            <rect class="waveform-bar" x="132" y="16" width="14" height="28" />
            <rect class="waveform-bar" x="154" y="12" width="14" height="36" />
          </g>
          <circle cx="130" cy="320" r="25" fill="#1976d2" stroke="#3b3b3b" stroke-width="3" />
          <polygon points="122,308 122,332 142,320" fill="#fff" />
        </svg>
      </div>
    </div>
    <div class="caption">
      YouTube → <span>AI Podcast</span> 🎙️<br>
      in 30 seconds flat
    </div>
  </div>
</body>
</html>
