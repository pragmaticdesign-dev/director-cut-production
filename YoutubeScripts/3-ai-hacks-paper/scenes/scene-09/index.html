<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 09 - Zero Dollar Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sparkle">✨</div>
  <div class="sparkle">💫</div>
  <div class="container">
    <div class="number-pill">03</div>
    <div class="title-card">
      <div class="title-the">THE</div>
      <div class="title-main">
        ZERO-DOLLAR<br>MOCKUP
        <svg class="hand-underline" viewBox="0 0 700 30">
          <path d="M 5 15 Q 120 5, 240 20 Q 360 30, 480 10 Q 580 2, 695 15" />
        </svg>
      </div>
    </div>
    <div class="price-tag">

        <path class="tag-string" d="M 175 0 Q 175 20, 175 40" />
        <path class="tag-body" d="M 50 50 L 300 50 L 330 150 L 300 250 L 50 250 L 20 150 Z" />
        <circle class="tag-hole" cx="65" cy="150" r="15" />
        <text class="dollar-sign" x="120" y="135">$</text>
        <text class="price-text" x="150" y="190">0</text>
      </svg>
    </div>
    <div class="free-badge">💸 COMPLETELY FREE</div>
  </div>
