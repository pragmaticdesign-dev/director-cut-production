<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 02 - Surveillance Alert</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scan-lines"></div>
  <div class="container">
    <div class="eye-container">
      <svg class="eye-svg" viewBox="0 0 500 300">
        <path class="eye-outline" d="M 50 150 Q 250 20 450 150 Q 250 280 50 150 Z" />
        <circle class="eye-iris" cx="250" cy="150" r="65" />
        <circle class="eye-pupil" cx="250" cy="150" r="30" />
        <circle class="eye-glint" cx="270" cy="130" r="12" />
        <line class="eye-outline" x1="130" y1="75" x2="120" y2="40" />
        <line class="eye-outline" x1="200" y1="48" x2="195" y2="12" />
        <line class="eye-outline" x1="300" y1="48" x2="305" y2="12" />
        <line class="eye-outline" x1="370" y1="75" x2="380" y2="40" />
      </svg>
    </div>

    <div class="alert-card">
      <div class="alert-text">PATCHING SOON</div>
      <div class="alert-sub">use these before they're gone 👀</div>
    </div>

    <div class="doodle-alerts">
      <div class="alert-doodle">🚨</div>
      <div class="alert-doodle">🔓</div>
      <div class="alert-doodle">⏳</div>
    </div>
  </div>
</body>
</html>
