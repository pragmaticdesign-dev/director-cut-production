<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 10 - Water Bottle Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="mockup-frame">
      <svg class="bottle-svg" viewBox="0 0 200 380">
        <rect class="bottle-cap" x="70" y="10" width="60" height="40" rx="8" />
        <path class="bottle-body" d="M 75 50 L 75 80 Q 40 100, 40 130 L 40 340 Q 40 365, 65 365 L 135 365 Q 160 365, 160 340 L 160 130 Q 160 100, 125 80 L 125 50 Z" />
        <rect class="bottle-label" x="52" y="180" width="96" height="80" rx="8" />
        <text class="bottle-label-text" x="100" y="215" text-anchor="middle">AQUA</text>
        <text class="bottle-label-text" x="100" y="245" text-anchor="middle" style="font-size:16px;font-weight:400">pure</text>
        <path class="water-lines" d="M 55 280 Q 75 275, 100 280 Q 125 285, 145 280" />
        <path class="water-lines" d="M 55 300 Q 80 295, 100 300 Q 120 305, 145 300" style="animation-delay:0.3s" />
        <path class="water-lines" d="M 55 320 Q 75 315, 100 320 Q 125 325, 145 320" style="animation-delay:0.6s" />
      </svg>
      <div class="free-pill">FREE</div>
    </div>
    <div class="designers-title">😱 Designers rn:</div>
    <div class="designers-row">
      <div class="stick-figure">
        <svg class="stick-svg" viewBox="0 0 100 180">
          <circle class="stick-head" cx="50" cy="25" r="20" />
          <line class="stick-part" x1="50" y1="45" x2="50" y2="110" />
          <circle cx="42" cy="22" r="4" fill="#3b3b3b" />
          <circle cx="58" cy="22" r="4" fill="#3b3b3b" />
          <ellipse cx="50" cy="36" rx="6" ry="5" fill="none" stroke="#3b3b3b" stroke-width="2" />
        </svg>
        <div class="stick-label">Designer</div>
      </div>
    </div>
    <div class="caption-box">AI mockups = $0 💀</div>
  </div>
</body>
</html>
