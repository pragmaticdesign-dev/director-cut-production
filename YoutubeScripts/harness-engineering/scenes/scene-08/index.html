<title>Scene 08 - NARROW & FOCUSED</title>
<style>
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #f5f0e8; font-family: sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }
  .loop { font-size: 200px; animation: spin 5s linear infinite; }
</style>
</head>
<body>
  <div class="container">
    <div class="loop">🔄</div>
    <h1 style="font-size: 80px; margin-top: 40px;">NARROW & FOCUSED</h1>
