<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 03 - External DB & Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1080px;height:1920px;overflow:hidden;
    background:#f5f0e8;
    font-family:'Quicksand',sans-serif;
    position:relative;
  }
  body::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.015) 3px,rgba(0,0,0,.015) 4px),
               repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,.01) 3px,rgba(0,0,0,.01) 4px);
    pointer-events:none;z-index:1;
  }
  body::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(180,170,155,.15) 59px,rgba(180,170,155,.15) 60px),
               repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(180,170,155,.15) 59px,rgba(180,170,155,.15) 60px);
    pointer-events:none;z-index:0;
  }
  .container{
    width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;z-index:2;
  }
  .title{
    position:absolute;top:100px;
    font-family:'Inter',sans-serif;font-weight:800;font-size:52px;
    color:#3b3b3b;text-align:center;letter-spacing:2px;
    animation:slideDown .7s ease-out;
  }
  .title span{color:#6a1b9a;}

  /* CPU center */
  .cpu-center{
    width:320px;height:320px;
    border:6px solid #3b3b3b;border-radius:24px;
    background:linear-gradient(135deg,#e3f2fd,#fff);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:6px 6px 0 #3b3b3b;
    position:relative;z-index:5;
    animation:bounceIn .8s both;
  }
  .cpu-center .icon{font-size:80px;}
  .cpu-center .label{
    font-family:'Inter',sans-serif;font-weight:800;
    font-size:44px;color:#3b3b3b;margin-top:8px;
  }

  /* Peripheral cards */
  .card{
    position:absolute;
    width:360px;padding:40px;
    border:5px solid #3b3b3b;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;
    gap:14px;box-shadow:5px 5px 0 #3b3b3b;z-index:5;
  }
  .card .card-icon{font-size:80px;}
  .card .card-title{
    font-family:'Inter',sans-serif;font-weight:700;
    font-size:36px;color:#3b3b3b;text-align:center;
  }
  .card .card-sub{
    font-family:'Quicksand',sans-serif;font-weight:500;
    font-size:24px;color:#777;text-align:center;
  }

  .card-db{
    top:460px;left:80px;background:#ffe8d6;
    animation:slideInLeft .8s .3s both;
  }
  .card-tools{
    top:460px;right:80px;background:#e1f5e0;
    animation:slideInRight .8s .3s both;
  }
  .card-api{
    bottom:280px;left:50%;transform:translateX(-50%);
    background:#fce4ec;
    animation:slideUp .8s .5s both;
  }

  /* Dashed connection lines - SVG */
  .connections{
    position:absolute;inset:0;z-index:3;
    animation:fadeIn 1s .6s both;
  }
  .dash-line{
    stroke:#3b3b3b;stroke-width:4;
    stroke-dasharray:16 12;fill:none;
    stroke-linecap:round;
  }
  .dash-line.animated{
    animation:dashMove 2s linear infinite;
  }
  @keyframes dashMove{
    0%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-56;}
  }

  /* Connection dots */
  .conn-dot{
    fill:#3b3b3b;
  }

  .corner{position:absolute;width:80px;height:80px;opacity:.25;}
  .corner-tl{top:40px;left:40px;border-top:5px solid #3b3b3b;border-left:5px solid #3b3b3b;border-radius:8px 0 0 0;}
  .corner-tr{top:40px;right:40px;border-top:5px solid #3b3b3b;border-right:5px solid #3b3b3b;border-radius:0 8px 0 0;}
  .corner-bl{bottom:40px;left:40px;border-bottom:5px solid #3b3b3b;border-left:5px solid #3b3b3b;border-radius:0 0 0 8px;}
  .corner-br{bottom:40px;right:40px;border-bottom:5px solid #3b3b3b;border-right:5px solid #3b3b3b;border-radius:0 0 8px 0;}

  .blueprint-label{
    position:absolute;bottom:100px;
    font-family:'Quicksand',sans-serif;font-weight:600;
    font-size:30px;color:#999;letter-spacing:3px;
    text-transform:uppercase;
    animation:fadeIn 1s 1s both;
  }

  @keyframes bounceIn{ 0%{transform:scale(0);opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1);opacity:1;} }
  @keyframes slideDown{0%{transform:translateY(-50px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  @keyframes slideInLeft{0%{transform:translateX(-80px);opacity:0;}100%{transform:translateX(0);opacity:1;}}
  @keyframes slideInRight{0%{transform:translateX(80px);opacity:0;}100%{transform:translateX(0);opacity:1;}}
  @keyframes slideUp{0%{transform:translateX(-50%) translateY(50px);opacity:0;}100%{transform:translateX(-50%) translateY(0);opacity:1;}}
  @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
</style>
</head>
<body>
  <div class="container">
    <div class="title">🔌 <span>Peripherals</span> Connect to CPU</div>
    <div class="cpu-center">
      <div class="icon">🧠</div>
      <div class="label">CPU</div>
    </div>
    <div class="card card-db">
      <div class="card-icon">📇</div>
      <div class="card-title">External DB</div>
      <div class="card-sub">Long-term memory<br>& knowledge store</div>
    </div>
    <div class="card card-tools">
      <div class="card-icon">🛠️</div>
      <div class="card-title">Tools</div>
      <div class="card-sub">APIs, functions<br>& integrations</div>
    </div>
    <div class="card card-api">
      <div class="card-icon">🌐</div>
      <div class="card-title">External APIs</div>
      <div class="card-sub">Web, search & data feeds</div>
    </div>
    <svg class="connections" viewBox="0 0 1080 1920"><line class="dash-line animated" x1="430" y1="990" x2="260" y2="660" /><line class="dash-line animated" x1="650" y1="990" x2="820" y2="660" /><line class="dash-line animated" x1="540" y1="1120" x2="540" y2="1380" /></svg>
    <div class="blueprint-label">Architecture Diagram v1.0</div>
  </div>
</body>
</html>
