<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 04 - Harness OS</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ width:1080px;height:1920px;overflow:hidden; background:#f5f0e8; font-family:'Quicksand',sans-serif; position:relative; }
  .container{ width:100%;height:100%;display:flex;flex-direction:column; align-items:center;justify-content:center;position:relative;z-index:2; }
  .title-bar{ position:absolute;top:80px;left:50%;transform:translateX(-50%); background:#3b3b3b;border-radius:18px; padding:20px 60px; box-shadow:5px 5px 0 rgba(0,0,0,.2); animation:slideDown .7s ease-out; }
  .title-bar h1{ font-family:'Inter',sans-serif;font-weight:900;font-size:64px; color:#f5f0e8;letter-spacing:6px; }
  .hub{ width:280px;height:280px;border-radius:50%; background:radial-gradient(circle at 40% 35%,#fff,#e3f2fd); border:6px solid #3b3b3b; display:flex;align-items:center;justify-content:center; position:relative;z-index:10; box-shadow:0 0 0 12px rgba(59,59,59,.06),0 0 40px rgba(25,118,210,.15); animation:pulseGlow 3s ease-in-out infinite, bounceIn .8s both; }
  .hub-icon{font-size:110px;}
  .node{ position:absolute;z-index:10; width:180px;height:180px; border:5px solid #3b3b3b;border-radius:20px; display:flex;flex-direction:column; align-items:center;justify-content:center;gap:8px; box-shadow:4px 4px 0 #3b3b3b; }
  .n1{top:380px;left:80px;background:#ffe8d6;animation:slideInLeft .8s .4s both;}
  .n2{top:380px;right:80px;background:#e1f5e0;animation:slideInRight .8s .4s both;}
  .n5{bottom:380px;left:50%;transform:translateX(-50%);background:#fff3e0;animation:slideUp .8s .8s both;}
  @keyframes bounceIn{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  @keyframes slideDown{0%{transform:translateX(-50%) translateY(-50px);opacity:0;}100%{transform:translateX(-50%) translateY(0);opacity:1;}}
</style>
</head>
<body>
  <div class="container">
    <div class="title-bar"><h1>HARNESS OS</h1></div>
    <div class="hub"><span class="hub-icon">⚙️</span></div>
    <div class="node n1">📝<br>Prompt</div>
    <div class="node n2">🔗<br>Context</div>
    <div class="node n5">🔄<br>Orchestrator</div>
  </div>
</body>
</html>
