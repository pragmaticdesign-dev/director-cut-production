<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 01 - Agent = Model + Harness</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1080px;height:1920px;overflow:hidden;
    background:#f5f0e8;
    font-family:'Quicksand',sans-serif;
    position:relative;
  }
  /* Paper texture overlay */
  body::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.015) 3px,rgba(0,0,0,.015) 4px),
               repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,.01) 3px,rgba(0,0,0,.01) 4px);
    pointer-events:none;z-index:1;
  }
  /* Grid lines like blueprint */
  body::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(180,170,155,.15) 59px,rgba(180,170,155,.15) 60px),
               repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(180,170,155,.15) 59px,rgba(180,170,155,.15) 60px);
    pointer-events:none;z-index:0;
  }
  .container{
    width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;z-index:2;
  }
  /* Top label */
  .top-label{
    position:absolute;top:80px;left:50%;transform:translateX(-50%);
    background:#e3f2fd;border:4px solid #3b3b3b;border-radius:16px;
    padding:18px 48px;font-family:'Inter',sans-serif;
    font-weight:700;font-size:38px;color:#3b3b3b;
    letter-spacing:2px;text-transform:uppercase;
    animation:slideDown .8s ease-out;
    box-shadow:4px 4px 0 #3b3b3b;
  }
  /* Big red circle */
  .big-circle{
    width:750px;height:750px;border-radius:50%;
    border:8px solid #d32f2f;
    background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.3),rgba(211,47,47,.08));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
    animation:bounceIn 1s ease-out;
    box-shadow:0 0 0 16px rgba(211,47,47,.08),6px 8px 0 #3b3b3b;
  }
  .big-circle::before{
    content:'';position:absolute;inset:12px;border-radius:50%;
    border:3px dashed rgba(211,47,47,.25);
  }
  /* Hand-drawn squiggle decoration */
  .squiggle-top,.squiggle-bottom{
    position:absolute;width:300px;height:30px;
    opacity:.3;
  }
  .squiggle-top{top:220px;right:60px;
    border-bottom:3px wavy #3b3b3b;animation:fadeSlideRight 1s .3s both;}
  .squiggle-bottom{bottom:320px;left:60px;
    border-top:3px wavy #3b3b3b;animation:fadeSlideLeft 1s .5s both;}

  .equation{
    text-align:center;
  }
  .agent-word{
    font-family:'Inter',sans-serif;font-weight:900;
    font-size:96px;color:#d32f2f;letter-spacing:4px;
    text-shadow:3px 3px 0 rgba(211,47,47,.15);
    animation:popIn .6s .3s both;
  }
  .equals{
    font-family:'Inter',sans-serif;font-weight:800;
    font-size:80px;color:#3b3b3b;margin:10px 0;
    animation:popIn .6s .5s both;
  }
  .formula-line{
    display:flex;align-items:center;gap:20px;
    animation:popIn .6s .7s both;
  }
  .model-box,.harness-box{
    padding:20px 40px;border-radius:18px;
    border:5px solid #3b3b3b;
    font-family:'Inter',sans-serif;font-weight:700;
    font-size:52px;color:#3b3b3b;
    box-shadow:4px 4px 0 #3b3b3b;
  }
  .model-box{background:#e3f2fd;}
  .harness-box{background:#e1f5e0;}
  .plus{
    font-family:'Inter',sans-serif;font-weight:800;
    font-size:72px;color:#3b3b3b;
  }

  /* Bottom annotation */
  .annotation{
    position:absolute;bottom:180px;
    font-family:'Quicksand',sans-serif;font-weight:600;
    font-size:34px;color:#666;letter-spacing:1px;
    padding:14px 40px;
    border:3px dashed #aaa;border-radius:14px;
    animation:fadeUp 1s .9s both;
  }
  /* Corner doodles */
  .corner{position:absolute;width:80px;height:80px;opacity:.25;}
  .corner-tl{top:40px;left:40px;border-top:5px solid #3b3b3b;border-left:5px solid #3b3b3b;border-radius:8px 0 0 0;}
  .corner-tr{top:40px;right:40px;border-top:5px solid #3b3b3b;border-right:5px solid #3b3b3b;border-radius:0 8px 0 0;}
  .corner-bl{bottom:40px;left:40px;border-bottom:5px solid #3b3b3b;border-left:5px solid #3b3b3b;border-radius:0 0 0 8px;}
  .corner-br{bottom:40px;right:40px;border-bottom:5px solid #3b3b3b;border-right:5px solid #3b3b3b;border-radius:0 0 8px 0;}

  /* Small decorative dots */
  .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#d32f2f;opacity:.2;}
  .dot-1{top:300px;left:100px;animation:pulse 2s infinite;}
  .dot-2{top:500px;right:80px;animation:pulse 2s .5s infinite;}
  .dot-3{bottom:400px;left:140px;animation:pulse 2s 1s infinite;}

  @keyframes bounceIn{
    0%{transform:scale(0);opacity:0;}
    50%{transform:scale(1.08);}
    70%{transform:scale(.96);}
    100%{transform:scale(1);opacity:1;}
  }
  @keyframes popIn{
    0%{transform:scale(0);opacity:0;}
    70%{transform:scale(1.1);}
    100%{transform:scale(1);opacity:1;}
  }
  @keyframes slideDown{
    0%{transform:translateX(-50%) translateY(-60px);opacity:0;}
    100%{transform:translateX(-50%) translateY(0);opacity:1;}
  }
  @keyframes fadeUp{
    0%{transform:translateY(30px);opacity:0;}
    100%{transform:translateY(0);opacity:1;}
  }
  @keyframes fadeSlideRight{
    0%{transform:translateX(-40px);opacity:0;}
    100%{transform:translateX(0);opacity:.3;}
  }
  @keyframes fadeSlideLeft{
    0%{transform:translateX(40px);opacity:0;}
    100%{transform:translateX(0);opacity:.3;}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.2;}
    50%{transform:scale(1.5);opacity:.4;}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top-label">⚡ Core Formula</div>
    <div class="squiggle-top"></div>
    <div class="squiggle-bottom"></div>
    <div class="big-circle">
      <div class="equation">
        <div class="agent-word">AGENT</div>
        <div class="equals">=</div>
        <div class="formula-line">
          <div class="model-box">MODEL</div>
          <span class="plus">+</span>
          <div class="harness-box">HARNESS</div>
        </div>
      </div>
    </div>
    <div class="annotation">🧩 The fundamental building block</div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
  </div>
</body>
</html>
