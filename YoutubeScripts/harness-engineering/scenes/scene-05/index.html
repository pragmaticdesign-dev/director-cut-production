<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 05 - 6X Performance</title>
<style>
  @keyframes growBar { 0%{height:0;} 100%{height:var(--h);} }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ width:1080px;height:1920px;overflow:hidden; background:#f5f0e8; font-family:sans-serif; position:relative; }
  .container{ width:100%;height:100%;display:flex;flex-direction:column; align-items:center;justify-content:center; }
  .bar-group{ display:flex; align-items:flex-end; gap:60px; height:800px; }
  .bar{ width:150px; border:5px solid #3b3b3b; border-radius:15px 15px 0 0; animation: growBar 1s ease-out both; }
  .bar-1{ --h: 120px; background:#e3f2fd; }
  .bar-2{ --h: 720px; background:#e1f5e0; animation-delay: 0.5s; }
</style>
</head>
<body>
  <div class="container">
    <h1 style="font-size: 100px; margin-bottom: 50px;">6X PERFORMANCE</h1>
    <div class="bar-group">
      <div class="bar bar-1"></div>
      <div class="bar bar-2"></div>
    </div>
    <p style="font-size: 40px; margin-top: 30px;">Harness Tweak > Model Swap</p>
  </div>
</body>
</html>
