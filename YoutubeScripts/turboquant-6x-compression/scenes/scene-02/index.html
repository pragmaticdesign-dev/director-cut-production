<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 02 - TURBOQUANT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #f5f0e8; font-family: 'Quicksand', sans-serif; position: relative; }
  .container { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 60px; }
  .top-label { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: #e3f2fd; border: 5px solid #3b3b3b; border-radius: 24px; padding: 18px 54px; font-size: 38px; font-weight: 700; color: #3b3b3b; letter-spacing: 3px; animation: popIn 0.5s ease-out both; }
  .title { font-size: 120px; font-weight: 700; color: #3b3b3b; text-align: center; letter-spacing: 8px; margin-bottom: 80px; animation: bounceIn 0.7s 0.4s ease-out both; }
  .title span { color: #1565c0; }
  .diamond-group { position: relative; width: 560px; height: 560px; animation: popIn 0.8s 0.6s ease-out both; }
  .diamond { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 200px; line-height: 1; filter: drop-shadow(0 0 40px rgba(21,101,192,0.5)); animation: diamondFloat 3s 1.5s ease-in-out infinite; }
  @keyframes popIn { 0% { opacity: 0; transform: translateX(-50%) scale(0.3); } 70% { transform: translateX(-50%) scale(1.08); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes bounceIn { 0% { opacity: 0; transform: translateY(-60px) scale(0.5); } 60% { transform: translateY(10px) scale(1.05); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes diamondFloat { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-20px); } }
</style>
</head>
<body>
<div class="container">
  <div class="top-label">SCENE 02</div>
  <div class="title">TURBO<span>QUANT</span></div>
  <div class="diamond-group">
    <div class="diamond">💎</div>
  </div>
</div>
</body>
</html>
