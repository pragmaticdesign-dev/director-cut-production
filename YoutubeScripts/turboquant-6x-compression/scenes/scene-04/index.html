<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 04 - THE DRAIN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #f5f0e8; font-family: 'Quicksand', sans-serif; position: relative; }
  .container { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .top-label { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: #fce4ec; border: 5px solid #3b3b3b; border-radius: 24px; padding: 18px 54px; font-size: 38px; font-weight: 700; color: #3b3b3b; letter-spacing: 3px; }
  .title { font-size: 120px; font-weight: 700; color: #d32f2f; text-align: center; letter-spacing: 6px; margin-top: -40px; }
  .snail { font-size: 140px; }
  .battery-visual { width: 320px; height: 150px; border: 6px solid #3b3b3b; border-radius: 20px; background: #fff; position: relative; }
  .battery-fill { position: absolute; left: 6px; top: 6px; bottom: 6px; width: 50px; background: #d32f2f; border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-label">SCENE 04</div>
  <div class="title">THE DRAIN</div>
  <div class="snail">🐌</div>
  <div class="battery-visual"><div class="battery-fill"></div></div>
</div>
</body>
</html>
