<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 04 - THE ORCHESTRATION SHIFT</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  @keyframes orbit { 0% { transform: rotate(0deg) translateX(280px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(280px) rotate(-360deg); } }
  @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #f5f0e8; font-family: 'Quicksand', sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }
  .center-folder { width: 180px; height: 160px; background: #ffe8d6; border: 5px solid #3b3b3b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 6px 6px 0 rgba(0,0,0,0.1); z-index: 10; }
  .robot-item { position: absolute; width: 110px; height: 110px; background: #fff; border: 5px solid #3b3b3b; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; animation: orbit 12s linear infinite; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
</style>
</head>
<body>
  <div class="container">
    <div class="center-folder">📁</div>
    <div class="robot-item">🤖</div>
    <h1 style="margin-top: 100px; font-size: 80px; text-align: center;">ORCHESTRATION SHIFT</h1>
  </div>
</body>
</html>
