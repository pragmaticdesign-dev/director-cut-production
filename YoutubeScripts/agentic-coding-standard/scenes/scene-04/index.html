<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 04 - THE ORCHESTRATION SHIFT</title>
<style>
  @keyframes orbit { 0% { transform: rotate(0deg) translateX(280px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(280px) rotate(-360deg); } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #f5f0e8; font-family: sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .center-folder { width: 180px; height: 160px; background: #ffe8d6; border: 5px solid #3b3b3b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .robot-item { position: absolute; width: 110px; height: 110px; background: #e1f5e0; border: 5px solid #3b3b3b; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; animation: orbit 12s linear infinite; }
</style>
</head>
<body>
  <div class="container">
    <div class="center-folder">📁</div>
    <div class="robot-item">🤖</div>
  </div>
</body>
</html>
