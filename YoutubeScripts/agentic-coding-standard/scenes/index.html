<title>Gallery - The Agentic Coding Standard</title>
<style>
  body { background: #f5f0e8; font-family: sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
  .card { background: #fff; border: 4px solid #3b3b3b; border-radius: 12px; padding: 20px; text-align: center; }
  iframe { width: 100%; height: 500px; border: 2px solid #ccc; margin-top: 15px; }
</style>
</head>
<body>
