<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 07 - SELF-HEALING</title>
<style>
  @keyframes bandaidSlap { 0% { transform: translate(200px, -200px) rotate(45deg) scale(0.5); opacity: 0; } 100% { transform: translate(0, 0) rotate(-5deg) scale(1); opacity: 1; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #f5f0e8; font-family: sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }
  .bandaid-overlay { font-size: 180px; animation: bandaidSlap 0.8s ease-out both 1s; z-index: 10; }
  .title { font-size: 100px; font-weight: 900; color: #3b3b3b; text-align: center; }
</style>
</head>
<body>
  <div class="container">
    <div class="bandaid-overlay">🩹</div>
    <h1 class="title">SELF-HEALING</h1>
  </div>
</body>
</html>
