<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 03 - 84% ADOPTION</title>
<style>
  @keyframes growBar { 0% { height: 0; } 100% { height: var(--bar-height); } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #f5f0e8; font-family: sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .big-number { font-size: 220px; font-weight: 900; color: #4caf50; }
  .chart-area { margin-top: 80px; width: 860px; height: 750px; background: #fff; border: 5px solid #3b3b3b; border-radius: 20px; display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding: 40px; }
  .bar { width: 100px; border: 5px solid #3b3b3b; border-radius: 14px 14px 0 0; animation: growBar 1.2s ease-out both; }
  .bar-6 { --bar-height: 510px; background-color: #4caf50; animation-delay: 2.3s; }
</style>
</head>
<body>
  <div class="container">
    <div class="big-number">84%</div>
    <div class="chart-area"><div class="bar bar-6"></div></div>
  </div>
</body>
</html>
